[project]
name = "job-extractor"
version = "0.1.0"
description = "Helps you to find your dream job"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.12.1",
    "fastapi>=0.143.0",
    "google-genai>=2.0",
    "httpx>=0.28.1",
    "openai>=3.26.1",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "tenacity>=9.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
job-extractor = "job_extractor:main"

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["job_extractor", "evaluation"]

[dependency-groups]
dev = [
    "beautifulsoup4>=4.15.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E, F: basic errors   I: import sorting   B: common bugs   UP: modern Python syntax
select = ["E", "F", "I", "B", "UP"]
