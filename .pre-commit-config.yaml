# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10  # `pre-commit autoupdate` bumps it
    hooks:
      - id: ruff-check   # the linter; older examples call this hook `ruff`
        args: [--fix]
      - id: ruff-format  # the formatter; keep it after ruff-check, since --fix can leave code needing reformatting
